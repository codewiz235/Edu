<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Franklin Gothic Demi:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="home.html" id="home-link"> 
            <button id="home-btn"><img src="https://img.icons8.com/?size=60&id=86527&format=png&color=00d4ff"></button>
        </a>
        <h1>Universities</h1>
        <button id="add-btn"><img src="https://img.icons8.com/?size=50&id=85298&format=png&color=00d4ff"></button>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-status="all">All</button>
        <button class="filter-btn" data-status="admitted">Admitted</button>
        <button class="filter-btn" data-status="pending">Pending</button>
        <button class="filter-btn" data-status="conditional">Conditional</button>
        <button class="filter-btn" data-status="rejected">Rejected</button>
    </div>

    <main id="applications-list">
        <div id="empty-state">No applications yet.<br>Tap + to add one.</div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add University</h2>
            <form id="uni-form">
                <input type="text" id="name" placeholder="University Name" required>
                
                <label for="logo-upload" class="file-label">
                    <span id="logo-status">Select University Logo (optional)</span>
                </label>
                <input type="file" id="logo-upload" accept="image/*" style="display:none;">
                <input type="hidden" id="logo" value=""> <input type="text" id="qualification" placeholder="Degree" required>
                <select id="status" required>
                    <option value="pending">Pending</option>
                    <option value="admitted">Admitted</option>
                    <option value="conditional">Conditional</option>
                    <option value="rejected">Rejected</option>
                </select>
                <input type="url" id="portalUrl" placeholder="Portal URL" required>
                <textarea id="details" placeholder="Details (optional)" rows="4"></textarea>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn"><img src="https://img.icons8.com/?size=45&id=114052&format=png&color=000000"></button>
                    <button type="submit" id="save-btn"><img src="https://img.icons8.com/?size=45&id=18765&format=png&color=000000"></button>
                </div>
            </form>
        </div>
    </div>
    
    <footer>
        <div class="footer-contact">
            <p>
                <img src="https://img.icons8.com/?size=50&id=82763&format=png&color=000000" alt="Email Icon" class="contact-icon">
                <a href="mailto:contact@myapp.com">contact@myapp.com</a>
            </p>
            <p>
                <img src="https://img.icons8.com/?size=50&id=9518&format=png&color=000000" alt="Phone Icon" class="contact-icon">
                <a href="tel:+1234567890">+1 234 567 890</a>
            </p>
        </div>

        <div class="social-icons">
            <a href="https://www.instagram.com/" target="_blank">
                <img src="https://img.icons8.com/?size=100&id=62855&format=png&color=008000" alt="WhatsApp">
            </a>
            <a href="https://twitter.com/" target="_blank">
                <img src="https://img.icons8.com/?size=100&id=37326&format=png&color=FF0000" alt="YouTube">
            </a>
            <a href="https://www.linkedin.com/" target="_blank">
                <img src="https://img.icons8.com/?size=100&id=118467&format=png&color=0000FF" alt="Facebook">
            </a>
        </div>

        <p class="copyright">&copy; 2025 My Applications Tracker. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script src="universities-sync.js"></script> 
</body>
</html>
